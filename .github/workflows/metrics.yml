name: Metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

jobs:
  metrics:
    name: Generate profile metrics
    runs-on: ubuntu-latest
    steps:
      - name: Generate full-year isocalendar
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: AxelJosephPM
          base: ""
          config_timezone: Europe/Madrid
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Generate recent blog posts
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.blog.svg
          token: NOT_NEEDED
          user: AxelJosephPM
          base: ""
          config_timezone: Europe/Madrid
          plugin_rss: yes
          # Custom-domain HTTPS currently fails certificate validation.
          # This verified Jekyll feed is generated by AxelJosephPM/axeljosephpm.github.io.
          plugin_rss_source: https://axeljosephpm.github.io/feed.xml
          plugin_rss_limit: 4
